name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  server:
    name: Server build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/Clinic.Api.Tests/Clinic.Api.Tests.csproj
      - name: Build
        run: dotnet build tests/Clinic.Api.Tests/Clinic.Api.Tests.csproj -c Release --no-restore
      - name: Test (load tests run in the nightly job)
        run: dotnet test tests/Clinic.Api.Tests/Clinic.Api.Tests.csproj -c Release --no-build --filter "Category!=Load" --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

  load:
    name: Load test (week offline, 50k changes)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/Clinic.Api.Tests/Clinic.Api.Tests.csproj -c Release --filter "Category=Load"

  docker:
    name: API image
    runs-on: ubuntu-latest
    needs: server
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f src/Clinic.Api/Dockerfile -t clinic-api:${{ github.sha }} .

  android:
    name: Android (AAB)
    runs-on: ubuntu-latest
    needs: server
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - run: dotnet workload install maui-android
      - name: Publish (signed when the keystore secrets are set)
        run: |
          SIGN=""
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/clinic.keystore"
            SIGN="-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$RUNNER_TEMP/clinic.keystore -p:AndroidSigningKeyAlias=$KEY_ALIAS -p:AndroidSigningKeyPass=env:KEY_PASSWORD -p:AndroidSigningStorePass=env:KEY_PASSWORD"
          fi
          dotnet publish src/Clinic.App/Clinic.App.csproj -f net10.0-android -c Release -p:AndroidPackageFormat=aab $SIGN
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: src/Clinic.App/bin/Release/net10.0-android/publish/*.aab

  windows:
    name: Windows
    runs-on: windows-latest
    needs: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install maui-windows
      - run: dotnet build src/Clinic.App/Clinic.App.csproj -f net10.0-windows10.0.19041.0 -c Release

  ios:
    name: iOS (unsigned build)
    runs-on: macos-latest
    needs: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install maui-ios
      - run: dotnet build src/Clinic.App/Clinic.App.csproj -f net10.0-ios -c Release -p:RuntimeIdentifier=iossimulator-arm64
